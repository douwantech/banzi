# 班子 · GoReleaser：一个 tag 就编译全架构、签名公证 macOS 二进制、建 GitHub Release、并更新 Homebrew tap。
# 用法：git tag vX.Y.Z && git push --tags → .github/workflows/release.yml 发版（也可以本地 goreleaser release）。
version: 2

project_name: banzi

builds:
  - id: ship
    main: ./cmd/ship
    binary: ship
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{ .Version }}

# macOS 二进制的签名 + 公证（Developer ID Application 证书 + App Store Connect API 密钥）。
# 证书和密钥只从环境变量来，仓库里不放：
#   MACOS_SIGN_P12 / MACOS_SIGN_PASSWORD                —— .p12（路径或 base64）和它的密码
#   MACOS_NOTARY_ISSUER_ID / MACOS_NOTARY_KEY_ID / MACOS_NOTARY_KEY —— 公证用的 API 密钥（.p8 路径或 base64）
# 没设 MACOS_SIGN_P12 时这一步跳过（比如本地 --snapshot 试编译），产出的就是未签名二进制。
# 裸二进制没法 staple：公证记录在苹果那边，首次运行时 Gatekeeper 联网核对一次。
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [ship]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: ship
    ids: [ship]
    name_template: "ship_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: douwantech
    name: banzi

# 把 ship 的 cask 写进 tap 仓库 douwantech/homebrew-banzi → brew install douwantech/banzi/ship。
# 用 cask（不是 formula）：Homebrew 对预编译二进制走 cask。cask 装的文件带 quarantine 标记，
# 所以 macOS 二进制必须签名 + 公证（见上面的 notarize），Gatekeeper 才放行。
# 写 tap 用一把只能写 tap 仓库的部署密钥（HOMEBREW_TAP_DEPLOY_KEY，私钥路径或内容），走 git over SSH：
# 本仓库自带的 GITHUB_TOKEN 写不了别的仓库，部署密钥比个人 token 权限小得多。
homebrew_casks:
  - name: ship
    ids: [ship]
    repository:
      owner: douwantech
      name: homebrew-banzi
      branch: main
      git:
        url: "git@github.com:douwantech/homebrew-banzi.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: "https://github.com/douwantech/banzi"
    description: "iOS 上架命令行（班子）：把 Fastlane 的 iOS 流程包成固定子命令 + 护栏"
