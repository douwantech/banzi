# 防泄露闸：每次 push / PR 扫描密钥与凭据，发现就红掉，挡在公开仓库之外。
# 直接跑 gitleaks 本体（钉版本 + 校验 sha256）：官方的 gitleaks-action 对组织仓库要许可证，没有就一直红。
name: 密钥扫描
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 扫全历史
      - name: 装 gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tgz
      - name: 扫描
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose .'
